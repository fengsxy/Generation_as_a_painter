<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generation as a Painter</title>
  <style>
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:#080d12;color:#e9e3d4;font-family:Arial,sans-serif;display:grid;grid-template-rows:auto 1fr}.bar{display:flex;align-items:center;gap:22px;padding:14px 20px;border-bottom:1px solid #2c3943;background:#0b1219}.brand{font:18px Georgia,serif;margin-right:auto}.brand small{display:block;font:8px monospace;letter-spacing:.18em;color:#798b94;margin-top:4px}.tabs{display:flex;gap:7px}.tabs button{border:1px solid #31424d;background:#101a22;color:#91a1a7;padding:9px 12px;font:10px monospace;cursor:pointer}.tabs button.on{border-color:#d3b65d;color:#e7ce7c;background:#1b2020}.tabs button:disabled{opacity:.35;cursor:default}.stage{position:relative;min-height:0}.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#0b1015}.meta{font:9px monospace;color:#5e717a}@media(max-width:700px){.bar{align-items:flex-start;flex-wrap:wrap}.brand{width:100%}.tabs{overflow:auto;width:100%}.meta{display:none}}
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand">Generation as a Painter<small>EXECUTABLE IMAGE GENERATION EXPERIMENTS</small></div>
    <nav class="tabs" aria-label="Experiments">
      <button class="on" data-page="stylization.html">CODE STYLIZATION</button>
      <button data-page="drawing.html">NATURAL DRAWING</button>
      <button data-page="prompt-to-code.html">PROMPT-TO-CODE</button>
      <button data-page="realist-portrait.html">REALIST PORTRAIT</button>
      <button data-page="pure-code-natural.html">PURE CODE</button>
      <button data-page="pure-code-landscape.html">PURE LANDSCAPE</button>
    </nav>
    <div class="meta" id="meta">01 / 06</div>
  </header>
  <main class="stage"><iframe id="experiment" title="Experiment" src="stylization.html"></iframe></main>
  <script>
    const frame=document.querySelector('#experiment'),buttons=[...document.querySelectorAll('[data-page]')],meta=document.querySelector('#meta');
    buttons.forEach((button,index)=>button.addEventListener('click',()=>{
      buttons.forEach(item=>item.classList.remove('on'));
      button.classList.add('on');
      frame.src=button.dataset.page;
      meta.textContent=`0${index+1} / 06`;
    }));
  </script>
</body>
</html>
